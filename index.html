<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSY GROUP OF COMPANY - गणेश चतुर्थी शुभकामनाएं</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9933, #ffffff, #138808);
            background-color: #fff5e6;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #333;
        }
        /* दोनों तरफ गेंदे के फूल और सजावट का बॉर्डर */
        .page-wrapper {
            background-image: radial-gradient(circle at 20px 20px, #ffcc00 2px, transparent 0);
            background-size: 40px 40px;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
            border: 4px double #ff9933;
            position: relative;
        }
        /* गेंदे के फूलों की लड़ियाँ (Borders) */
        .container::before, .container::after {
            content: "🌸🌼🌸🌼🌸🌼🌸🌼🌸";
            font-size: 20px;
            position: absolute;
            left: 0;
            right: 0;
            letter-spacing: 3px;
        }
        .container::before {
            top: 10px;
        }
        .container::after {
            bottom: 10px;
        }
        h1 {
            color: #d11919;
            font-size: 32px;
            margin-top: 25px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        h2 {
            color: #ff6600;
            font-size: 24px;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        /* एनिमेटेड इमेज स्टाइल */
        .ganesh-img {
            width: 85%;
            max-width: 280px;
            border-radius: 15px;
            margin: 15px 0;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
            border: 3px solid #ff9933;
            background-color: #fffbf5;
        }
        .message {
            font-size: 19px;
            line-height: 1.7;
            color: #444;
            padding: 10px 15px;
            font-weight: 500;
        }
        .footer {
            margin-top: 30px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #d11919;
            font-size: 20px;
            border-top: 2px dashed #ff9933;
            padding-top: 20px;
        }
        .company-name {
            color: #003366;
            font-size: 26px;
            display: block;
            margin-top: 8px;
            font-family: 'Arial Black', Gadget, sans-serif;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="container">
            <h1>🚩 जय श्री गणेश 🚩</h1>
            <h2>गणेश चतुर्थी की हार्दिक शुभकामनाएं</h2>
            
            <!-- सुरक्षित एनिमेटेड गणेश जी की फोटो (GIF) -->
            <img class="ganesh-img" src="https://giphy.com" alt="Lord Ganesha Animated">
            
            <div class="message">
                <p>भगवान श्री गणेश आपके जीवन में सुख, समृद्धि, रिद्धि-सिद्धि और अपार खुशियाँ लेकर आएं। इस पावन पर्व पर आपके व्यापार और परिवार में मंगल ही मंगल हो।</p>
                <p>हमारे साथ जुड़े रहने के लिए आपका हृदय से धन्यवाद।</p>
            </div>
            
            <div class="footer">
                शुभकामनाओं सहित:
                <span class="company-name">ROSY GROUP OF COMPANY</span>
            </div>
        </div>
    </div>

</body>
</html>
