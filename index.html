<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रोसी ग्रुप ऑफ कंपनी - गणेश चतुर्थी शुभकामनाएं</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9933, #ffffff, #138808);
            background-color: #fff5e6;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            border: 2px solid #ff9933;
        }
        h1 {
            color: #d11919;
            font-size: 28px;
            margin-bottom: 5px;
        }
        h2 {
            color: #ff6600;
            font-size: 22px;
            margin-top: 5px;
        }
        .ganesh-img {
            width: 90%;
            max-width: 320px;
            border-radius: 12px;
            margin: 15px 0;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #ff9933;
        }
        .message {
            font-size: 18px;
            line-height: 1.6;
            color: #444;
            padding: 0 10px;
            font-weight: 500;
        }
        .footer {
            margin-top: 25px;
            font-weight: bold;
            color: #d11919;
            font-size: 20px;
            border-top: 1px dashed #ff9933;
            padding-top: 15px;
        }
        .company-name {
            color: #003366;
            font-size: 24px;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚩 जय श्री गणेश 🚩</h1>
        <h2>गणेश चतुर्थी की हार्दिक शुभकामनाएं</h2>
        
        <!-- Updated high-availability image link -->
        <img class="ganesh-img" src="https://wikimedia.org" alt="Lord Ganesha">
        
        <div class="message">
            <p>भगवान श्री गणेश आपके जीवन में सुख, समृद्धि, रिद्धि-सिद्धि और अपार खुशियाँ लेकर आएं। इस पावन पर्व पर आपके व्यापार और परिवार में मंगल ही मंगल हो।</p>
            <p>हमारे साथ जुड़े रहने के लिए आपका हृदय से धन्यवाद।</p>
        </div>
        
        <div class="footer">
            शुभकामनाओं सहित:
            <span class="company-name">✨ रोसी ग्रुप ऑफ कंपनी ✨</span>
        </div>
    </div>

</body>
</html>
